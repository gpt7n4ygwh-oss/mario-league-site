<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mario Super Sluggers League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mario Super Sluggers League</h1>
        <nav>
            <a href="#">Standings</a>
            <a href="#">Schedule</a>
            <a href="#">Trades</a>
        </nav>
    </header>

    <main>
        <h2>Standings</h2>
        <table>
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Wins</th>
                    <th>Losses</th>
                </tr>
            </thead>
            <tbody id="standings-body">
            </tbody>
        </table>
        <h2>Schedule</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Home</th>
                    <th>Away</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="schedule-body">
            </tbody>
        </table>
        <h2>Trades</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Team A</th>
                    <th>Team A Sends</th>
                    <th>Team B</th>
                    <th>Team B Sends</th>
                </tr>
            </thead>
            <tbody id="trades-body">
            </tbody>
        </table>
    </main>
    
    <footer>
        <p>League run by Nathan and friends.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
