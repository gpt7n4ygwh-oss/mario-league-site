<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Mario Super Sluggers League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mario Super Sluggers League</h1>
        <nav>
            <a href="#">Standings</a>
            <a href="#">Schedule</a>
            <a href="#">Trades</a>
        </nav>
    </header>

    <main>
        <h2>Standings</h2>
        <table>
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Wins</th>
                    <th>Losses</th>
                </tr>
            </thead>
            <tbody id="standings-body">
            </tbody>
        </table>
        <h2>Schedule</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Home</th>
                    <th>Away</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="schedule-body">
            </tbody>
        </table>
        <h2>Trades</h2>
        <div id="trades-container"></div>
        <h2>Live</h2>
        <div class="video-wrapper">
            <iframe
                src="https://www.youtube.com/embed/live_stream?channel="
                title="Live Stream"
                allowfullscreen>
            </iframe>
        </div>
    </main>

    <footer>
        <p>FAF League.</p>
    </footer>
    <script src="image-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
